trigger:
 branches:
  include:
    - main

pool: infra-agents

stages:
  - stage:
    jobs:
      - job: 
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
              
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'infrapipeline'
              backendAzureRmStorageAccountName: 'deepstorageac'
              backendAzureRmContainerName: 'infrapipeline-container'
              backendAzureRmKey: 'terraform.tfstate'
            
          

